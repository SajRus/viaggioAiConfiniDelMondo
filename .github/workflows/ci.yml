name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: godot-gdunit-labs/gdUnit4-action@v1.4.2
        with:
          godot-version: '4.7'
          version: installed
          paths: res://test
          headless: true
          # gdUnit4 6.x rifiuta l'headless senza questa opzione.
          arguments: --ignoreHeadlessMode
          warnings-as-errors: true
